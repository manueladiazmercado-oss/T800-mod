plugins {
    id 'fabric-loom' version '1.14-SNAPSHOT'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group
base { archivesName = project.archives_base_name }

repositories { }

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
}

// The complete, newer client implementation lives in /java. The old src/main/java
// copies are intentionally not compiled to avoid duplicate class definitions.
sourceSets {
    main {
        java.setSrcDirs(['java'])
        resources.setSrcDirs(['src/main/resources'])
    }
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") { expand "version": inputs.properties.version }
    // Bundle optional built-in resource packs that are stored outside Gradle's default resource tree.
    from('resources') {
        include 'resourcepacks/**'
    }
}

tasks.withType(JavaCompile).configureEach { options.release = 21 }
java { withSourcesJar(); sourceCompatibility = JavaVersion.VERSION_21; targetCompatibility = JavaVersion.VERSION_21 }


// Generate the 64x32 T-800 mechanical Elytra texture as part of the build,
// so the published JAR contains a real PNG without committing binary blobs.
def t800ElytraPackDir = layout.buildDirectory.dir("generated/t800ElytraPack/resourcepacks/t800_elytra")
tasks.register("generateT800ElytraPack") {
    outputs.dir(t800ElytraPackDir)
    doLast {
        def packDir = t800ElytraPackDir.get().asFile
        def texture = new File(packDir, "assets/minecraft/textures/entity/elytra.png")
        texture.parentFile.mkdirs()
        texture.bytes = java.util.Base64.decoder.decode("")
        def meta = new File(packDir, "pack.mcmeta")
        meta.parentFile.mkdirs()
        meta.text = '{"pack":{"pack_format":75,"description":"T-800 Cybernetic Elytra"}}'
    }
}
processResources.dependsOn(tasks.named("generateT800ElytraPack"))
processResources {
    from(t800ElytraPackDir) {
        include "resourcepacks/**"
    }
}
