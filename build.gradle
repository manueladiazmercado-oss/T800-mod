plugins {
    id 'fabric-loom' version '1.14-SNAPSHOT'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group
base { archivesName = project.archives_base_name }

repositories { }

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
}

// The complete, newer client implementation lives in /java. The old src/main/java
// copies are intentionally not compiled to avoid duplicate class definitions.
sourceSets {
    main {
        java.setSrcDirs(['java'])
        resources.setSrcDirs(['src/main/resources'])
    }
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") { expand "version": inputs.properties.version }
    from('resources') {
        include 'resourcepacks/**'
    }
}

tasks.withType(JavaCompile).configureEach { options.release = 21 }
java { withSourcesJar(); sourceCompatibility = JavaVersion.VERSION_21; targetCompatibility = JavaVersion.VERSION_21 }

// Generate an animated 64x(32*8) elytra sprite sheet and pack metadata.
// Each frame changes the red reactor strips, so the stock 3D elytra model gets a
// pulsing T-800 mechanical skin without replacing Minecraft's player renderer.
def t800ElytraPackDir = layout.buildDirectory.dir("generated/t800ElytraPack")
tasks.register("generateT800ElytraPack") {
    outputs.dir(t800ElytraPackDir)
    doLast {
        def packDir = new File(t800ElytraPackDir.get().asFile, "resourcepacks/t800_elytra")
        def texture = new File(packDir, "assets/minecraft/textures/entity/elytra.png")
        texture.parentFile.mkdirs()

        def width = 64
        def frameHeight = 32
        def frames = 8
        def sheet = new java.awt.image.BufferedImage(width, frameHeight * frames, java.awt.image.BufferedImage.TYPE_INT_ARGB)
        def g = sheet.createGraphics()
        g.setRenderingHint(java.awt.RenderingHints.KEY_ANTIALIASING, java.awt.RenderingHints.VALUE_ANTIALIAS_OFF)

        for (int f = 0; f < frames; f++) {
            int y0 = f * frameHeight
            // Keep the vanilla elytra UV layout and transparent background.
            // Pixel-art wing plates: charcoal steel, bevels, segmented armor, red reactor channels.
            def poly = { int[] xs, int[] ys, java.awt.Color c ->
                def p = new java.awt.Polygon(xs, ys, xs.length)
                g.setColor(c); g.fillPolygon(p)
            }
            def c = { int r, int gg, int b, int a = 255 -> new java.awt.Color(r, gg, b, a) }
            int pulse = [100, 145, 205, 255, 220, 170, 125, 95][f]
            g.translate(0, y0)
            // left and right wings, with a narrow central hinge
            poly([2, 24, 30, 27, 20, 7] as int[], [2, 0, 5, 21, 30, 25] as int[], c(12, 15, 22))
            poly([34, 40, 57, 62, 57, 38] as int[], [5, 0, 2, 25, 30, 21] as int[], c(12, 15, 22))
            // plate bevels and layered armor
            poly([4, 23, 27, 23, 8] as int[], [4, 3, 7, 19, 23] as int[], c(54, 60, 72))
            poly([36, 41, 55, 59, 55, 39] as int[], [7, 3, 4, 23, 23, 19] as int[], c(54, 60, 72))
            poly([7, 21, 24, 20, 10] as int[], [6, 5, 8, 17, 20] as int[], c(29, 33, 42))
            poly([40, 43, 53, 56, 53, 40] as int[], [8, 5, 6, 20, 17, 17] as int[], c(29, 33, 42))
            // segmented plates, deliberately chunky at Minecraft's native pixel scale
            g.setColor(c(83, 90, 103))
            [8, 13, 18, 23].each { int x -> g.drawLine(x, 7, x + 2, 17) }
            [40, 45, 50, 55].each { int x -> g.drawLine(x, 7, x - 2, 17) }
            g.setColor(c(8, 10, 14))
            g.drawLine(6, 19, 20, 25); g.drawLine(43, 25, 58, 19)
            // red emissive strips pulse through the animation frames
            g.setColor(c(90, 0, 0)); g.drawLine(5, 7, 8, 22); g.drawLine(58, 7, 55, 22)
            g.setColor(c(pulse, 8, 14)); g.fillRect(6, 7, 3, 16); g.fillRect(55, 7, 3, 16)
            g.setColor(c(Math.min(255, pulse + 35), 35, 40)); g.drawLine(6, 8, 7, 13); g.drawLine(57, 8, 56, 13)
            // central T-800 reactor and twin thruster marks
            poly([28, 36, 38, 35, 29] as int[], [8, 8, 23, 27, 23] as int[], c(12, 14, 19))
            g.setColor(c(90, 10, 15)); g.fillRect(31, 10, 2, 10)
            g.setColor(c(pulse, 15, 20)); g.fillRect(31, 10, 3, 8)
            g.setColor(c(100, 100, 110)); g.drawLine(28, 9, 30, 11); g.drawLine(36, 9, 34, 11)
            g.setColor(c(pulse, 18, 18)); g.fillRect(29, 22, 2, 4); g.fillRect(34, 22, 2, 4)
            g.setColor(c(255, Math.max(25, (int)(pulse / 4)), Math.max(25, (int)(pulse / 4)))); g.drawLine(29, 23, 29, 24); g.drawLine(34, 23, 34, 24)
            g.translate(0, -y0)
        }
        g.dispose()
        javax.imageio.ImageIO.write(sheet, "png", texture)

        def meta = new File(packDir, "assets/minecraft/textures/entity/elytra.png.mcmeta")
        meta.parentFile.mkdirs()
        meta.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson([
            animation: [frametime: 3, interpolate: false, frames: (0..7).collect { [index: it, time: 3] }]
        ]))
        def packMeta = new File(packDir, "pack.mcmeta")
        packMeta.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson([
            pack: [pack_format: 75, description: "T-800 Cybernetic Elytra - high-contrast animated red reactor texture"]
        ]))
        new File(packDir, "README.txt").text = """T-800 CYBERNETIC ELYTRA
This pack replaces the vanilla elytra texture with an animated charcoal-steel and red-reactor skin.
Enable it in Options > Resource Packs. The elytra remains Minecraft's vanilla 3D model; this pack animates the emissive-looking red texture only and does not add custom wing folding geometry or jet particles.
"""
    }
}
// Generate a second bundled resource pack: detailed 3D weapon models and cybernetic armor textures.
def t800GearPackDir = layout.buildDirectory.dir("generated/t800GearPack")
tasks.register("generateT800GearPack") {
    outputs.dir(t800GearPackDir)
    doLast {
        def root = new File(t800GearPackDir.get().asFile, "resourcepacks/t800_arsenal")
        def assets = new File(root, "assets/minecraft")
        def texDir = new File(assets, "textures/item")
        def modelDir = new File(assets, "models/item")
        def armorDir = new File(assets, "textures/models/armor")
        texDir.mkdirs(); modelDir.mkdirs(); armorDir.mkdirs()

        def color = { int r, int gg, int b -> new java.awt.Color(r, gg, b, 255) }
        def pixelTexture = { File file, String kind, int frame ->
            def im = new java.awt.image.BufferedImage(16, 16, java.awt.image.BufferedImage.TYPE_INT_ARGB)
            def g = im.createGraphics()
            g.setRenderingHint(java.awt.RenderingHints.KEY_ANTIALIASING, java.awt.RenderingHints.VALUE_ANTIALIAS_OFF)
            g.setColor(color(17, 20, 27)); g.fillRect(0, 0, 16, 16)
            if (kind == "blade") {
                for (int y=0; y<16; y++) {
                    g.setColor(color(67 + (y%3)*9, 76 + (y%2)*8, 88 + (y%3)*7)); g.drawLine(6,y,9,y)
                    g.setColor(color(153,164,177)); g.drawLine(6,y,6,y)
                    g.setColor(color(35,41,51)); g.drawLine(9,y,9,y)
                }
                g.setColor(color(100, 0, 7)); g.fillRect(7, 2, 1, 11)
                g.setColor(color(100 + frame*18, 8, 14)); g.fillRect(7, 3, 1, 9)
                g.setColor(color(210, 220, 230)); g.drawLine(6,1,8,1)
            } else if (kind == "metal") {
                for (int y=0; y<16; y++) for (int x=0; x<16; x++) {
                    int v = ((x+y)%5==0) ? 83 : (((x*3+y*7)%7==0) ? 62 : 35)
                    g.setColor(color(v, v+4, v+12)); g.fillRect(x,y,1,1)
                }
                g.setColor(color(118,128,143)); g.drawRect(2,2,11,11)
                g.setColor(color(125, 5, 12)); g.fillRect(7,4,2,7)
                g.setColor(color(210, 12+frame*4, 20)); g.fillRect(7,5,1,5)
                g.setColor(color(8,10,14)); [3,12].each { int x -> g.fillRect(x,3,2,2); g.fillRect(x,11,2,2) }
            } else if (kind == "grip") {
                g.setColor(color(12,14,18)); g.fillRect(4,0,8,16)
                g.setColor(color(63,69,79)); [1,4,7,10,13].each { int y -> g.drawLine(5,y,10,y+1) }
                g.setColor(color(112,8,14)); g.drawLine(7,2,7,13)
                g.setColor(color(175,12,18)); g.drawLine(8,4,8,11)
            } else if (kind == "glow") {
                g.setColor(color(75,0,5)); g.fillRect(5,1,6,14)
                g.setColor(color(180,8,18)); g.fillRect(7,2,2,12)
                g.setColor(color(255, Math.min(80, 20+frame*8), 28)); g.fillRect(7,4,1,8)
            }
            g.dispose(); javax.imageio.ImageIO.write(im, "png", file)
        }
        ["blade","metal","grip","glow"].each { String k ->
            def f = new File(texDir, "t800_${k}.png")
            pixelTexture(f,k,0)
            if (k == "glow" || k == "metal") {
                def meta = new File(texDir, "t800_${k}.png.mcmeta")
                meta.text = groovy.json.JsonOutput.toJson([animation:[frametime:3, frames:(0..7).collect { [index:it, time:3] }]])
                // Animation sheets must stack frames vertically; write an 8-frame sheet.
                def sheet = new java.awt.image.BufferedImage(16,128,java.awt.image.BufferedImage.TYPE_INT_ARGB)
                for (int fr=0; fr<8; fr++) {
                    def frameFile = new File(texDir, "frame_tmp.png")
                    pixelTexture(frameFile,k,fr)
                    def frameImg = javax.imageio.ImageIO.read(frameFile)
                    def sg = sheet.createGraphics(); sg.drawImage(frameImg,0,fr*16,null); sg.dispose(); frameFile.delete()
                }
                javax.imageio.ImageIO.write(sheet,"png",f)
            }
        }

        def face = { String texture -> [north:[uv:[0,0,16,16],texture:"${texture}"], south:[uv:[0,0,16,16],texture:"${texture}"], east:[uv:[0,0,16,16],texture:"${texture}"], west:[uv:[0,0,16,16],texture:"${texture}"], up:[uv:[0,0,16,16],texture:"${texture}"], down:[uv:[0,0,16,16],texture:"${texture}"]] }
        def cube = { int x1,int y1,int z1,int x2,int y2,int z2,String material ->
            [from:[x:x1,y:y1,z:z1],to:[x:x2,y:y2,z:z2],faces:face("#${material}")]
        }
        def weaponModels = [
            iron_sword: [cube(6,4,7,10,14,9,"blade"),cube(3,3,6,13,5,10,"metal"),cube(7,0,7,9,4,9,"grip"),cube(6,2,6,10,3,10,"glow")],
            diamond_sword: [cube(6,4,7,10,14,9,"blade"),cube(3,3,6,13,5,10,"metal"),cube(7,0,7,9,4,9,"grip"),cube(6,2,6,10,3,10,"glow")],
            netherite_sword: [cube(6,4,7,10,14,9,"blade"),cube(3,3,6,13,5,10,"metal"),cube(7,0,7,9,4,9,"grip"),cube(6,2,6,10,3,10,"glow")],
            iron_axe: [cube(6,1,7,10,6,9,"grip"),cube(7,5,7,9,12,9,"grip"),cube(3,9,6,12,14,10,"metal"),cube(1,8,6,5,13,10,"blade"),cube(5,10,6,8,13,10,"glow")],
            diamond_axe: [cube(6,1,7,10,6,9,"grip"),cube(7,5,7,9,12,9,"grip"),cube(3,9,6,12,14,10,"metal"),cube(1,8,6,5,13,10,"blade"),cube(5,10,6,8,13,10,"glow")],
            netherite_axe: [cube(6,1,7,10,6,9,"grip"),cube(7,5,7,9,12,9,"grip"),cube(3,9,6,12,14,10,"metal"),cube(1,8,6,5,13,10,"blade"),cube(5,10,6,8,13,10,"glow")],
            iron_pickaxe: [cube(2,11,6,14,14,10,"metal"),cube(3,9,7,6,12,9,"blade"),cube(10,9,7,13,12,9,"blade"),cube(7,1,7,9,12,9,"grip"),cube(7,4,6,9,7,10,"glow")],
            netherite_pickaxe: [cube(2,11,6,14,14,10,"metal"),cube(3,9,7,6,12,9,"blade"),cube(10,9,7,13,12,9,"blade"),cube(7,1,7,9,12,9,"grip"),cube(7,4,6,9,7,10,"glow")]
        ]
        weaponModels.each { String name, def elements ->
            def model = [parent:"minecraft:item/handheld", textures:[blade:"minecraft:item/t800_blade",metal:"minecraft:item/t800_metal",grip:"minecraft:item/t800_grip",glow:"minecraft:item/t800_glow"], elements:elements]
            new File(modelDir,"${name}.json").text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(model))
        }

        // High-detail pixel-art cybernetic armor overlays for chestplate, leggings and boots.
        // The base layer textures keep the vanilla 64x32 UV layout.
        ["iron","diamond","netherite"].each { String tier ->
            [1,2].each { int layer ->
                def im = new java.awt.image.BufferedImage(64,32,java.awt.image.BufferedImage.TYPE_INT_ARGB)
                def g = im.createGraphics()
                g.setRenderingHint(java.awt.RenderingHints.KEY_ANTIALIASING, java.awt.RenderingHints.VALUE_ANTIALIAS_OFF)
                // Keep transparent pixels outside the armor UV islands.
                def islands = layer == 1 ? [[8,0,8,8],[20,0,8,8],[0,8,8,12],[16,8,8,12],[40,8,8,12],[32,8,8,12],[4,20,4,12],[20,20,4,12],[44,20,4,12],[52,20,4,12]] : [[20,0,8,4],[0,4,8,12],[16,4,8,12],[40,4,8,12],[32,4,8,12],[4,16,4,12],[20,16,4,12],[44,16,4,12],[52,16,4,12]]
                islands.each { a ->
                    for (int y=a[1]; y<a[1]+a[3]; y++) for (int x=a[0]; x<a[0]+a[2]; x++) {
                        int shade = ((x+y)%6==0) ? 94 : (((x*5+y*3)%7==0) ? 66 : 29)
                        if (tier=="diamond") shade += 10
                        if (tier=="netherite") shade -= 8
                        g.setColor(color(Math.max(8,shade-3),Math.max(10,shade),Math.max(14,shade+10))); g.fillRect(x,y,1,1)
                    }
                    g.setColor(color(111,119,132)); g.drawRect(a[0],a[1],a[2]-1,a[3]-1)
                }
                // Red reactor channels and rivets across torso/legs.
                g.setColor(color(95,0,6)); g.fillRect(23,7,2,9); g.fillRect(7,9,2,5); g.fillRect(45,9,2,5)
                g.setColor(color(210,12,20)); g.fillRect(24,8,1,7); g.fillRect(7,10,1,3); g.fillRect(45,10,1,3)
                g.setColor(color(150,155,165)); [[10,2],[22,2],[2,10],[18,10],[34,10],[42,10],[6,22],[22,22],[46,22],[54,22]].each { p -> g.fillRect(p[0],p[1],1,1) }
                g.dispose()
                def armorName = tier+"_layer_${layer}.png"
                javax.imageio.ImageIO.write(im,"png",new File(armorDir,armorName))
            }
        }
        new File(root,"pack.mcmeta").text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson([pack:[pack_format:75,description:"T-800 Arsenal - 3D mechanical weapons and cybernetic armor"]]))
        new File(root,"README.txt").text = """T-800 ARSENAL RESOURCE PACK
Enable under Options > Resource Packs.
Includes custom blocky 3D item models for iron/diamond/netherite swords, iron/diamond/netherite axes and iron/netherite pickaxes; animated red reactor texture details; and cybernetic armor layer textures.
Minecraft's built-in item model format is used; these are low-poly voxel-style models, not a replacement rendering engine. Armor textures replace the corresponding vanilla iron/diamond/netherite armor textures while this pack is active.
"""
    }
}
processResources.dependsOn(tasks.named("generateT800GearPack"))
processResources {
    from(t800GearPackDir) {
        include "resourcepacks/**"
    }
}

// Generate an animated, mechanically detailed T-800 crossbow pack using vanilla item texture paths.
// Texture frames pulse the reactor; vanilla pull-state models still control the draw/release animation.
def t800CrossbowPackDir = layout.buildDirectory.dir("generated/t800CrossbowPack")
tasks.register("generateT800CrossbowPack") {
    outputs.dir(t800CrossbowPackDir)
    doLast {
        def root = new File(t800CrossbowPackDir.get().asFile, "resourcepacks/t800_crossbow")
        def itemDir = new File(root, "assets/minecraft/textures/item"); itemDir.mkdirs()
        ["crossbow_standby", "crossbow_pulling_0", "crossbow_pulling_1", "crossbow_pulling_2"].eachWithIndex { String variant, int vi ->
            def sheet = new java.awt.image.BufferedImage(32, 256, java.awt.image.BufferedImage.TYPE_INT_ARGB)
            for (int fr=0; fr<8; fr++) {
                def g = sheet.createGraphics()
                g.setRenderingHint(java.awt.RenderingHints.KEY_ANTIALIASING, java.awt.RenderingHints.VALUE_ANTIALIAS_OFF)
                g.translate(0, fr*32)
                def c = { int r,int gg,int b -> new java.awt.Color(r,gg,b,255) }
                int pulse = [95,125,175,225,255,235,180,120][fr]
                int tension = vi==0 ? 0 : (vi==1 ? 1 : (vi==2 ? 2 : 3))
                // Stock, spine and bevels.
                g.setColor(c(8,10,14)); g.fillRect(11,4,10,24)
                g.setColor(c(25,30,39)); g.fillRect(12,5,8,22)
                g.setColor(c(94,105,119)); g.fillRect(12,6,1,18); g.fillRect(19,7,1,17)
                g.setColor(c(51,59,71)); g.fillRect(13,5,6,2); g.fillRect(13,24,6,2)
                g.setColor(c(13,16,22)); g.fillRect(9,9,14,6); g.setColor(c(72,82,97)); g.fillRect(10,10,12,2)
                // Twin articulated limbs and metal rails; draw state tightens the silhouette.
                g.setColor(c(14,17,23)); g.fillRect(3,6-tension,8,4); g.fillRect(21,6-tension,8,4)
                g.fillRect(3,8-tension,3,16+tension*2); g.fillRect(26,8-tension,3,16+tension*2)
                g.setColor(c(66,77,92)); g.drawLine(4,8-tension,10,8-tension); g.drawLine(22,8-tension,28,8-tension)
                g.drawLine(4,22+tension,10,22+tension); g.drawLine(22,22+tension,28,22+tension)
                g.setColor(c(120,130,144)); g.drawLine(5,10-tension,5,20+tension); g.drawLine(27,10-tension,27,20+tension)
                // Reactor glass, animated core, containment rings and side vents.
                g.setColor(c(55,0,7)); g.fillRect(14,9,4,12)
                g.setColor(c(pulse,4,14)); g.fillRect(15,10,2,10)
                g.setColor(c(255,Math.min(115,18+fr*12),35)); g.fillRect(15,12,1,6)
                g.setColor(c(125,7,15)); g.drawRect(13,8,5,13)
                g.setColor(c(91,101,116)); g.fillRect(10,12,2,1); g.fillRect(20,12,2,1); g.fillRect(10,16,2,1); g.fillRect(20,16,2,1)
                // Rivets, warning stripes and rear power cell.
                g.setColor(c(145,155,169)); [[12,7],[19,7],[12,22],[19,22],[6,10],[25,10],[6,20],[25,20]].each { p -> g.fillRect(p[0],p[1],1,1) }
                g.setColor(c(100,5,12)); g.fillRect(13,24,6,2); g.setColor(c(220,14,24)); g.drawLine(14,24,17,24)
                g.setColor(c(36,42,51)); g.fillRect(8,13,2,3); g.fillRect(22,13,2,3)
                if (fr==3 || fr==4) { g.setColor(c(255,48,28)); g.fillRect(15,4,2,2) }
                if (fr==4) { g.setColor(c(255,180,95)); g.fillRect(15,3,2,1); g.setColor(c(255,35,25)); g.drawLine(11,5,12,6); g.drawLine(19,6,20,5) }
                g.translate(0,-fr*32); g.dispose()
            }
            def f = new File(itemDir, variant + ".png")
            javax.imageio.ImageIO.write(sheet, "png", f)
            new File(itemDir, variant + ".png.mcmeta").text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson([animation:[frametime:2, interpolate:false, frames:(0..7).collect { [index:it, time:2] }]]))
        }
        // Texture used by the crossbow item model for the loaded arrow/bolt indicator.
        def bolt = new java.awt.image.BufferedImage(16,16,java.awt.image.BufferedImage.TYPE_INT_ARGB)
        def bg = bolt.createGraphics(); bg.setRenderingHint(java.awt.RenderingHints.KEY_ANTIALIASING, java.awt.RenderingHints.VALUE_ANTIALIAS_OFF)
        bg.setColor(new java.awt.Color(24,28,36,255)); bg.fillRect(7,1,2,14)
        bg.setColor(new java.awt.Color(125,135,150,255)); bg.fillRect(6,3,4,2); bg.fillRect(6,11,4,2)
        bg.setColor(new java.awt.Color(205,10,22,255)); bg.fillRect(7,4,2,7)
        bg.setColor(new java.awt.Color(255,70,40,255)); bg.fillRect(7,6,1,3)
        bg.dispose(); javax.imageio.ImageIO.write(bolt,"png",new File(itemDir,"crossbow_arrow.png"))
        new File(root, "pack.mcmeta").text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson([pack:[pack_format:75, description:"T-800 Animated Plasma Crossbow - reinforced limbs and pulsing reactor"]]))
        new File(root, "README.txt").text = "T-800 ANIMATED PLASMA CROSSBOW. Correct vanilla crossbow texture paths are used: crossbow_standby and crossbow_pulling_0/1/2. Animated 8-frame reactor pulse, metal bevels, mechanical limbs, rivets and warning accents. Vanilla draw/release timing and projectile physics are unchanged. The red bolt icon is only the loaded crossbow indicator, not the flying projectile; a spherical projectile requires a custom renderer/entity."
    }
}
processResources.dependsOn(tasks.named("generateT800CrossbowPack"))
processResources { from(t800CrossbowPackDir) { include "resourcepacks/**" } }

processResources.dependsOn(tasks.named("generateT800ElytraPack"))
processResources {
    from(t800ElytraPackDir) {
        include "resourcepacks/**"
    }
}
